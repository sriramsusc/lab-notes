name: ✅ Add a task
description: Put something on the checklist.
title: "[task] "
labels: ["intake", "task", "new-task"]
body:
  - type: markdown
    attributes:
      value: |
        Four fields. Closing a task later requires a written report of what you did,
        so a description with some substance in it now makes that easier to write.

  - type: input
    id: title
    attributes:
      label: Task
      description: Short and specific — a thing that can actually be finished.
      placeholder: Reproduce Table 2 of the Vaswani paper on our dataset
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: The scope, plus anything you'll want to remember when you pick it up.
      placeholder: |
        Run the released code against our splits and check the numbers land
        within a point of the reported table. Flag it if the gap is bigger.
    validations:
      required: true

  - type: input
    id: due
    attributes:
      label: Target date
      description: Optional. Use YYYY-MM-DD so it sorts correctly.
      placeholder: "2026-09-01"

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
      default: 1
    validations:
      required: true
