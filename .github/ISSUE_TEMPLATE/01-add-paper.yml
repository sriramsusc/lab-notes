name: 📄 Add a paper
description: Put a paper on the reading list. The summary comes later, through its own form.
title: "[paper] "
labels: ["intake", "paper", "new-paper"]
body:
  - type: markdown
    attributes:
      value: |
        Six fields. Anything else you want on the page — venue, DOI, tags, notes —
        can be added later with the **Edit file directly** link at the bottom of the paper.

  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: Attention Is All You Need
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Authors
      description: Optional. Comma-separated, or "First Author et al."
      placeholder: Vaswani et al.

  - type: input
    id: published
    attributes:
      label: Month and year
      placeholder: June 2017
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link
      description: Optional. arXiv page, PDF, or publisher URL.
      placeholder: https://arxiv.org/abs/1706.03762

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
      default: 1
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why I'm reading it
      description: A sentence or two on how it connects to what you're working on.
      placeholder: Baseline architecture for the sequence models I want to adapt.
    validations:
      required: true
